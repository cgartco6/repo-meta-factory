app = "automated-agency-mesh-core"
primary_region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[experimental]
  allowed_public_ports = []

[[vm]]
  memory = "512MB"
  cores = 1
  cpu_kind = "shared"
